name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/client/**'
      - '.github/workflows/deploy-pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/client/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VITE_API_BASE_URL: https://voyager-api-dev.microgentic-voyager.workers.dev
  PAGES_PROJECT_NAME: voyager-web

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/client/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --prefix apps/client

      - name: Type check
        run: npm --prefix apps/client run check

      - name: Build
        run: npm --prefix apps/client run build

      - name: Deploy Pages preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: >
          npx wrangler pages deploy apps/client/build
          --project-name "$PAGES_PROJECT_NAME"
          --branch "${{ github.head_ref }}"
          --commit-hash "${{ github.event.pull_request.head.sha }}"
          --commit-message "PR #${{ github.event.pull_request.number }} preview"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Pages production
        if: github.event_name != 'pull_request'
        run: >
          npx wrangler pages deploy apps/client/build
          --project-name "$PAGES_PROJECT_NAME"
          --branch main
          --commit-hash "${{ github.sha }}"
          --commit-message "Production deploy ${{ github.sha }}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
