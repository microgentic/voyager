name: Deploy Worker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Checkout Messaging Core
        uses: actions/checkout@v4
        with:
          repository: microgentic/messaging-core-service
          ref: main
          path: messaging-core-service
          ssh-key: ${{ secrets.MESSAGING_CORE_SERVICE_DEPLOY_KEY }}

      - name: Install Messaging Core dependencies
        run: npm ci
        working-directory: messaging-core-service

      - name: Build Messaging Core package
        run: npm run build
        working-directory: messaging-core-service

      - name: Backend smoke
        run: npm run smoke:backend:local
        env:
          MESSAGING_CORE_SERVICE_ROOT: ${{ github.workspace }}/messaging-core-service

      - name: Create Messaging Core deploy config
        if: github.event_name != 'pull_request'
        working-directory: messaging-core-service
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { appendFileSync, writeFileSync } from "node:fs";

          const workerName = "voyager-messaging-worker";
          let databaseName = "voyager-messaging-control";
          let databaseId = null;
          const d1List = JSON.parse(execFileSync("npx", ["wrangler", "d1", "list", "--json"], {
            encoding: "utf8",
            env: process.env
          }));

          try {
            const response = await fetch(
              `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${workerName}/settings`,
              { headers: { authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` } }
            );
            const payload = await response.json();
            if (!response.ok || payload.success === false) {
              throw new Error(JSON.stringify(payload.errors ?? payload));
            }
            const bindings = payload.result?.bindings ?? payload.result?.settings?.bindings ?? [];
            const d1Binding = bindings.find((binding) => {
              const type = String(binding.type ?? binding.binding_type ?? "");
              return binding.name === "CONTROL_DB" && /d1/i.test(type);
            });
            databaseId = d1Binding?.id ?? d1Binding?.database_id ?? d1Binding?.databaseId ?? null;
            databaseName = d1Binding?.database_name ?? d1Binding?.databaseName ?? databaseName;
          } catch (error) {
            console.warn(`Could not read existing ${workerName} D1 binding: ${error.message ?? error}`);
          }

          const database = d1List.find((candidate) => candidate.name === databaseName || candidate.uuid === databaseId || candidate.id === databaseId);
          databaseId = databaseId ?? database?.uuid ?? database?.id ?? null;
          databaseName = database?.name ?? databaseName;

          if (!databaseId) {
            const names = d1List.map((candidate) => candidate.name).join(", ");
            throw new Error(`Could not find D1 database for ${workerName}. Available D1 databases: ${names}`);
          }

          const config = {
            $schema: "node_modules/wrangler/config-schema.json",
            account_id: process.env.CLOUDFLARE_ACCOUNT_ID,
            name: workerName,
            main: "apps/voyager-messaging-worker.example/src/index.ts",
            compatibility_date: "2026-06-22",
            vars: {
              MESSAGING_SERVICE_NAME: "voyager-messaging",
              MESSAGING_ROUTE_PREFIX: "/",
              CORS_ALLOWED_ORIGINS: "https://voyager-web.pages.dev",
              MESSAGING_TOKEN_ISSUER_ALLOWLIST: "voyager",
              MESSAGING_TOKEN_AUDIENCE: "messaging-core",
              MESSAGING_INTERNAL_SERVICE_ISSUER_ALLOWLIST: "voyager",
              MESSAGING_INTERNAL_SERVICE_AUDIENCE: "messaging-core-internal",
              MESSAGING_REALTIME_PROTOCOL: "messaging.realtime.v1",
              MESSAGING_REALTIME_ACCEPT_LEGACY_PROTOCOLS: "voyager.realtime.v1",
              MESSAGING_EVENT_OUTBOX_ENABLED: "1",
              MESSAGING_EVENT_QUEUE_BINDING: "EVENT_QUEUE",
              MESSAGING_EVENT_REDRIVE_SCHEDULED_ENABLED: "1",
              MESSAGING_EVENT_DEAD_LETTER_ALERT_THRESHOLD: "1",
              CALLS_ENABLED: "1",
              AUDIO_CALLS_ENABLED: "1",
              VIDEO_CALLS_ENABLED: "1",
              SCREEN_SHARE_ENABLED: "1",
              CALLS_REALTIME_MEDIA_ENABLED: "1",
              CLOUDFLARE_REALTIME_MOCK: "0"
            },
            triggers: {
              crons: ["*/5 * * * *"]
            },
            d1_databases: [
              {
                binding: "CONTROL_DB",
                database_name: databaseName,
                database_id: databaseId,
                migrations_dir: "packages/messaging-core/migrations"
              }
            ],
            r2_buckets: [
              {
                binding: "ATTACHMENTS_BUCKET",
                bucket_name: "voyager-messaging-attachments"
              }
            ],
            queues: {
              producers: [
                {
                  binding: "EVENT_QUEUE",
                  queue: "voyager-messaging-events"
                }
              ]
            },
            durable_objects: {
              bindings: [
                { name: "REALTIME_MAILBOX", class_name: "RealtimeMailbox" },
                { name: "CONVERSATION_COORDINATOR", class_name: "ConversationCoordinator" },
                { name: "CALL_COORDINATOR", class_name: "CallCoordinator" }
              ]
            },
            migrations: [
              { tag: "v1-realtime-mailbox", new_sqlite_classes: ["RealtimeMailbox"] },
              { tag: "v2-conversation-coordinator", new_sqlite_classes: ["ConversationCoordinator"] },
              { tag: "v3-call-coordinator", new_sqlite_classes: ["CallCoordinator"] }
            ],
            observability: {
              enabled: true
            }
          };

          writeFileSync("wrangler.voyager-dev.jsonc", `${JSON.stringify(config, null, 2)}\n`);
          appendFileSync(process.env.GITHUB_ENV, `MESSAGING_CORE_D1_DATABASE_NAME=${databaseName}\n`);
          NODE

      - name: Apply Messaging Core D1 migrations
        if: github.event_name != 'pull_request'
        working-directory: messaging-core-service
        run: npx wrangler d1 migrations apply "$MESSAGING_CORE_D1_DATABASE_NAME" --remote --config wrangler.voyager-dev.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Ensure Messaging Core event queue
        if: github.event_name != 'pull_request'
        working-directory: messaging-core-service
        run: |
          npx wrangler queues list --config wrangler.voyager-dev.jsonc > /tmp/voyager-core-queues.txt
          if grep -q 'voyager-messaging-events' /tmp/voyager-core-queues.txt; then
            echo "Queue voyager-messaging-events already exists"
          else
            npx wrangler queues create voyager-messaging-events --config wrangler.voyager-dev.jsonc
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Messaging Core Worker
        if: github.event_name != 'pull_request'
        working-directory: messaging-core-service
        run: npx wrangler deploy --config wrangler.voyager-dev.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Apply D1 migrations
        if: github.event_name != 'pull_request'
        run: npm run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker
        if: github.event_name != 'pull_request'
        run: npm run deploy:dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Remote all-Core parity smoke
        if: github.event_name != 'pull_request'
        run: npm run smoke:messaging-core-parity
        env:
          BASE_URL: https://voyager-api-dev.microgentic-voyager.workers.dev
          VOYAGER_LOGIN_EMAIL: grace@example.com
          VOYAGER_LOGIN_PASSWORD: voyager-demo-pass
          SMOKE_MESSAGING_CORE_ROOM_WRITE_INVITEE_EMAIL: alan@example.com
          SMOKE_MESSAGING_CORE_ROOM_WRITE_TRANSFER_EMAIL: katherine@example.com
          SMOKE_MESSAGING_CORE_ROOM_WRITE_DECLINE_EMAIL: dorothy@example.com
          SMOKE_MESSAGING_CORE_ROOM_WRITE_DIRECT_EMAIL: margaret@example.com
          SMOKE_MESSAGING_CORE_ALL_CUTOVER: "1"

      - name: Remote post-deploy smoke
        if: github.event_name != 'pull_request'
        run: npm run smoke:backend:remote
        env:
          BASE_URL: https://voyager-api-dev.microgentic-voyager.workers.dev
